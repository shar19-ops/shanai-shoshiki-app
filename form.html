<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>社内書式</title>
<link rel="icon" href="assets/logo-mark.jpg">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div id="app"></div>
<script src="assets/app.js"></script>
<script src="assets/codes.js"></script>
<script>
  // ?id=04 → forms/04.js を読み込んでから描画
  (function () {
    var id = new URLSearchParams(location.search).get('id') || '';
    if (!/^[0-9A-Za-z_-]+$/.test(id)) { document.getElementById('app').textContent = '帳票IDが不正です'; return; }
    var s = document.createElement('script');
    s.src = 'forms/' + id + '.js';
    s.onload = function () { ShoshikiApp.boot(); };
    s.onerror = function () { document.getElementById('app').textContent = '帳票が見つかりません: ' + id; };
    document.body.appendChild(s);
  })();
</script>
</body>
</html>
