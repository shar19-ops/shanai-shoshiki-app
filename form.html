<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>社内書式</title>
<link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1f3f8f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&display=swap">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div id="app"></div>
<script src="assets/app.js"></script>
<script src="assets/codes.js"></script>
<script src="assets/date-stamp.js"></script>
<script>
  // ?id=04 → forms/04.js を読み込んでから描画
  (function () {
    var id = new URLSearchParams(location.search).get('id') || '';
    if (!/^[0-9A-Za-z_-]+$/.test(id)) { document.getElementById('app').textContent = '帳票IDが不正です'; return; }
    var s = document.createElement('script');
    s.src = 'forms/' + id + '.js';
    // 帳票のファイルが FORM_NEEDS を指定していれば（共通の定義を持つ帳票。本-購買-A0002-1〜3）、それを順に読み込んでから描画
    s.onload = function () {
      var needs = window.FORM_NEEDS || [];
      (function next(i) {
        if (i >= needs.length) { ShoshikiApp.boot(); return; }
        var t = document.createElement('script');
        t.src = 'forms/' + needs[i] + '.js';
        t.onload = function () { next(i + 1); };
        t.onerror = s.onerror;
        document.body.appendChild(t);
      })(0);
    };
    s.onerror = function () { document.getElementById('app').textContent = '帳票が見つかりません: ' + id; };
    document.body.appendChild(s);
  })();
</script>
</body>
</html>
