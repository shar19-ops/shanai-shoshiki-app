<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>社内書式アプリ一覧</title>
<link rel="icon" href="assets/logo-mark.jpg">
<link rel="stylesheet" href="assets/app.css">
<style>
  /* 配布用一覧（A4縦・PDF化してリンク付きで配布） */
  @page { size: A4 portrait; margin: 0; }
  .lst { width: 100%; border-collapse: collapse; table-layout: fixed; border: 1.2px solid var(--line); }
  .lst th, .lst td { border: 1px solid var(--line); padding: 1mm 2mm; vertical-align: middle; }
  .lst th { background: var(--label-bg); font-weight: normal; font-size: 9pt; height: 7mm; }
  .lst td { height: 12.5mm; font-size: 10pt; }
  .lst td.no { text-align: center; white-space: nowrap; }
  .lst td.t { font-weight: bold; }
  .lst td.u a { color: var(--accent); font-size: 8pt; word-break: break-all; }
  .lst td.q { text-align: center; padding: .5mm; }
  .lst td.q img { width: 11.5mm; height: 11.5mm; image-rendering: pixelated; display: block; margin: 0 auto; }
  .lead { font-size: 9.5pt; line-height: 1.7; margin: 0 0 3mm; }
</style>
</head>
<body>
<div class="toolbar no-print">
  <div class="tb-title"><a href="./">一覧 ＞ </a>配布用一覧（PDF化用）</div>
  <button class="primary" onclick="window.print()">印刷 / PDF保存</button>
</div>
<div id="pages"></div>
<script src="assets/vendor/qrcode.min.js"></script>
<script src="forms/catalog.js"></script>
<script>
  (function () {
    // 公開URL（?base= で上書き可）
    var BASE = new URLSearchParams(location.search).get('base') || 'https://shar19-ops.github.io/shanai-shoshiki-app/';
    var PER_PAGE = 16;
    var today = new Date();
    var dateStr = today.getFullYear() + '年' + (today.getMonth() + 1) + '月' + today.getDate() + '日';

    function qr(url) {
      var q = qrcode(0, 'M'); q.addData(url); q.make();
      return q.createDataURL(4, 0);
    }
    function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

    var root = document.getElementById('pages');
    var total = Math.ceil(CATALOG.length / PER_PAGE);
    for (var p = 0; p < total; p++) {
      var items = CATALOG.slice(p * PER_PAGE, (p + 1) * PER_PAGE);
      var rows = items.map(function (c) {
        var url = BASE + 'form.html?id=' + c.id;
        return '<tr><td class="no">' + esc(c.no) + '</td><td class="t">' + esc(c.title) + '</td>' +
          '<td class="u"><a href="' + esc(url) + '">' + esc(url) + '</a></td>' +
          '<td class="q"><img alt="" src="' + qr(url) + '"></td></tr>';
      }).join('');
      var sheet = document.createElement('div');
      sheet.className = 'sheet A4 portrait';
      sheet.innerHTML =
        '<div class="f-header"><div class="f-head-left">' +
          '<div class="f-code">一般社内書類</div>' +
          '<div class="f-title xlong">社内書式アプリ一覧</div>' +
          '<div class="f-meta"><span>' + dateStr + ' 現在　（' + (p + 1) + ' / ' + total + '）</span></div>' +
        '</div></div>' +
        '<div class="sheet-body">' +
          (p === 0 ? '<p class="lead">各書類名のリンク（またはQRコード）からアプリを開き、入力して「印刷」してください。印刷した書類はこれまでどおり紙で回送します。<br>' +
            '帳票一覧のトップページ：<a href="' + esc(BASE) + '">' + esc(BASE) + '</a></p>' : '') +
          '<table class="lst"><colgroup><col style="width:13%"><col style="width:33%"><col><col style="width:15mm"></colgroup>' +
          '<thead><tr><th>番号</th><th>書類名</th><th>アプリのリンク</th><th>QR</th></tr></thead><tbody>' + rows + '</tbody></table>' +
        '</div>' +
        '<div class="f-footer"><div class="brand"><img class="mark" src="assets/logo-mark.jpg" alt=""><img class="name" src="assets/logo-name.png" alt="株式会社 雄電社"></div>' +
        '<div class="f-ver">社内書式アプリ一覧</div></div>';
      root.appendChild(sheet);
    }
  })();
</script>
</body>
</html>
