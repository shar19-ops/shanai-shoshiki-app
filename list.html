<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>社内書式アプリ一覧</title>
<link rel="icon" href="assets/logo-mark.jpg">
<link rel="stylesheet" href="assets/app.css">
<style>
  /* 配布用一覧（A4縦・PDF化してリンク付きで配布）。見た目はブラウザの帳票一覧に合わせる */
  @page { size: A4 portrait; margin: 0; }
  .lp {
    width: 210mm; height: 297mm; margin: 16px auto; background: #fff;
    box-shadow: 0 2px 10px rgba(0,0,0,.25);
    display: flex; flex-direction: column; overflow: hidden;
  }
  /* ヘッダー：イメージカラーの青の帯（用紙の端まで） */
  .lp-band {
    background: linear-gradient(120deg, #1f3f8f 0%, #23489f 60%, #2b56b8 100%);
    color: #fff; padding: 11mm 14mm 8mm; display: flex; align-items: center; gap: 8mm;
  }
  .lp-band .bt { flex: 1; min-width: 0; }
  .lp-band .kicker { font-size: 9pt; letter-spacing: .25em; opacity: .85; }
  .lp-band h1 { margin: 1.5mm 0 3mm; font-size: 24pt; letter-spacing: .12em; font-weight: bold; }
  .lp-band .lead { font-size: 9.5pt; line-height: 1.75; opacity: .95; }
  .lp-band .lead a { color: #fff; }
  .lp-band .top-qr { text-decoration: none; background: #fff; border-radius: 3mm; padding: 2.5mm; text-align: center; color: #1f3f8f; font-size: 7.5pt; line-height: 1.3; }
  .lp-band .top-qr img { width: 22mm; height: 22mm; display: block; image-rendering: pixelated; margin-bottom: 1mm; }
  .lp-band.compact { padding: 7mm 14mm 5mm; }
  .lp-band.compact h1 { font-size: 16pt; margin: 1mm 0 0; }
  /* 本文：カード（ブラウザの一覧と同じ形） */
  .lp-body { flex: 1; padding: 7mm 12mm 0; background: #eef1f6; }
  .lp-meta { display: flex; justify-content: space-between; font-size: 8.5pt; color: #5a6476; margin-bottom: 3mm; }
  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 2.6mm 3.5mm; }
  .card {
    display: flex; align-items: center; gap: 3mm; background: #fff;
    border-radius: 2mm; padding: 2mm 2.5mm 2mm 3.5mm; text-decoration: none; color: inherit;
    border: .3mm solid #dfe4ec; height: 17.5mm;
  }
  .card .no { font-size: 8pt; color: #fff; background: #1f3f8f; border-radius: 1mm; padding: .8mm 1.8mm; white-space: nowrap; }
  .card .t { flex: 1; font-size: 10.5pt; line-height: 1.35; color: #1f3f8f; font-weight: bold; }
  .card .t::after { content: " ›"; color: #8fa0c8; font-weight: normal; }
  .card img { width: 13.5mm; height: 13.5mm; image-rendering: pixelated; flex-shrink: 0; }
  .lp-foot { display: flex; align-items: center; justify-content: space-between; padding: 4mm 12mm 6mm; background: #eef1f6; }
  .lp-foot .brand { display: flex; align-items: center; gap: 3mm; }
  .lp-foot .brand .mark { height: 6.5mm; }
  .lp-foot .brand .name { height: 4mm; }
  .lp-foot .pg { font-size: 7.5pt; color: #6b7588; }
  @media print {
    body { background: #fff; }
    .lp { margin: 0; box-shadow: none; page-break-after: always; break-after: page; }
    .lp:last-child { page-break-after: auto; break-after: auto; }
  }
</style>
</head>
<body>
<div class="toolbar no-print">
  <div class="tb-title"><a href="./">一覧 ＞ </a>配布用一覧（PDF化用）</div>
  <button class="primary" onclick="window.print()">印刷 / PDF保存</button>
</div>
<div id="pages"></div>
<script src="assets/vendor/qrcode.min.js"></script>
<script src="forms/catalog.js"></script>
<script>
  (function () {
    // 公開URL（?base= で上書き可）
    var BASE = new URLSearchParams(location.search).get('base') || 'https://shar19-ops.github.io/shanai-shoshiki-app/';
    var FIRST = 20, PER_PAGE = 26; // 1ページ目はヘッダーが大きいので少なめ
    var t = new Date();
    var dateStr = t.getFullYear() + '年' + (t.getMonth() + 1) + '月' + t.getDate() + '日';

    function qr(url) {
      var q = qrcode(0, 'M'); q.addData(url); q.make();
      return q.createDataURL(4, 0);
    }
    function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

    var chunks = [CATALOG.slice(0, FIRST)];
    for (var i = FIRST; i < CATALOG.length; i += PER_PAGE) chunks.push(CATALOG.slice(i, i + PER_PAGE));
    var root = document.getElementById('pages');
    chunks.forEach(function (items, p) {
      var cards = items.map(function (c) {
        var url = BASE + 'form.html?id=' + c.id;
        // カード全体が書類名のリンク（URLの文字は出さない）
        return '<a class="card" href="' + esc(url) + '"><span class="no">' + esc(c.no) + '</span>' +
          '<span class="t">' + esc(c.title) + '</span><img alt="" src="' + qr(url) + '"></a>';
      }).join('');
      var band = p === 0
        ? '<div class="lp-band"><div class="bt"><div class="kicker">一般社内書類</div><h1>社内書式アプリ一覧</h1>' +
            '<div class="lead">書類名をクリック（またはQRコードを読み取り）すると、入力画面が開きます。<br>' +
            '入力して「印刷」し、これまでどおり紙で回送してください。</div></div>' +
            '<a class="top-qr" href="' + esc(BASE) + '"><img alt="" src="' + qr(BASE) + '">帳票一覧<br>トップページ</a></div>'
        : '<div class="lp-band compact"><div class="bt"><div class="kicker">一般社内書類</div><h1>社内書式アプリ一覧</h1></div></div>';
      var page = document.createElement('div');
      page.className = 'lp';
      page.innerHTML = band +
        '<div class="lp-body"><div class="lp-meta"><span>' + dateStr + ' 現在　全' + CATALOG.length + '帳票</span><span>' + (p + 1) + ' / ' + chunks.length + '</span></div>' +
        '<div class="cards">' + cards + '</div></div>' +
        '<div class="lp-foot"><div class="brand"><img class="mark" src="assets/logo-mark.jpg" alt=""><img class="name" src="assets/logo-name.png" alt="株式会社 雄電社"></div>' +
        '<div class="pg">' + esc(BASE) + '</div></div>';
      root.appendChild(page);
    });
  })();
</script>
</body>
</html>
