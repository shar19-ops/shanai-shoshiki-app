<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Y-Format（社内書式アプリ）</title>
<link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Y-Format">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1f3f8f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&display=swap">
<link rel="stylesheet" href="assets/app.css">
<style>
  .wrap { max-width: 980px; margin: 0 auto; padding: 16px; }
  .intro { background: #fff; border-radius: 6px; padding: 12px 16px; font-size: 10pt; line-height: 1.7; margin-bottom: 14px; }
  .search { width: 100%; font: inherit; font-size: 11pt; padding: 8px 12px; border: 1px solid #b8bfcc; border-radius: 6px; margin-bottom: 12px; }
  .list { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 8px; }
  .card {
    display: flex; align-items: center; gap: 10px;
    background: #fff; border-radius: 6px; padding: 10px 12px;
    text-decoration: none; color: inherit; border: 1px solid transparent;
  }
  a.card:hover { border-color: var(--accent); box-shadow: 0 1px 4px rgba(31,63,143,.25); }
  .card .no { font-size: 9pt; color: #fff; background: var(--accent); border-radius: 3px; padding: 2px 6px; white-space: nowrap; }
  /* 帳票名は1行で表示。入りきらない時だけ文字を小さくする（fitNames） */
  /* アプリ名 Y-Format（2026-10-21 決定）：ご案内と同じ Montserrat ExtraBold、Format は黄色 */
  .tb-title .app-sub { font-size: 10pt; margin-left: 10px; opacity: .9; font-weight: bold; }
  @media (max-width: 560px) { .tb-title .app-sub { display: none; } } /* スマホでは名前だけにしてボタンを1行に */
  .card .t { font-size: 10.5pt; line-height: 19px; white-space: nowrap; overflow: hidden; min-width: 0; }
  .card.wip { opacity: .55; }
  .card.wip .no { background: #888; }
  .card .badge { margin-left: auto; font-size: 8pt; color: #666; white-space: nowrap; }
  /* NEW マークの説明（カードの NEW と同じ見た目） */
  .intro .new-legend { display: inline-block; font-size: 8pt; font-weight: 800; color: #fff; background: #e8452c; border-radius: 99px; padding: 1px 8px; letter-spacing: .05em; vertical-align: 1px; margin-right: 2px; }
  .cats { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .cats button { font: inherit; font-size: 10pt; padding: 5px 14px; border-radius: 99px; border: 1px solid #b8bfcc; background: #fff; color: #333; cursor: pointer; }
  .cats button:hover { border-color: var(--accent); }
  .cats button.on { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
  /* 書式の種類（一般書式／品質記録様式）：職種ボタンの上のタブ */
  .kinds { display: flex; gap: 0; margin-bottom: 10px; border-bottom: 2px solid var(--accent); }
  .kinds button { font: inherit; font-size: 11pt; font-weight: 700; padding: 7px 20px; border: 1px solid #b8bfcc; border-bottom: 0; border-radius: 6px 6px 0 0; background: #e9edf4; color: #555; cursor: pointer; margin-right: 4px; }
  .kinds button:hover { color: var(--accent); }
  .kinds button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .card.q .no { background: #2e7d5b; } /* 品質記録様式の番号は緑 */
  .list .empty { grid-column: 1 / -1; color: #666; font-size: 10pt; padding: 12px 4px; }
  .card .common { font-size: 8pt; color: #4a5a7a; background: #e6ecf7; border-radius: 3px; padding: 1px 5px; white-space: nowrap; }
  .card .new { margin-left: auto; font-size: 8pt; font-weight: 800; color: #fff; background: #e8452c; border-radius: 99px; padding: 2px 8px; letter-spacing: .05em; white-space: nowrap; }
</style>
</head>
<body>
<div class="toolbar"><div class="tb-title"><span class="app-name"><span class="y">Y</span>-Format</span><span class="app-sub" id="sub">社内書式アプリ　一般社内書類</span></div><button onclick="location.href='list.html'">配布用一覧</button></div>
<div class="wrap">
  <div class="intro">
    帳票を選んで入力し、「印刷」ボタンで紙に出力して回送してください。<br>
    入力内容はこのパソコンのブラウザ内にだけ一時保存されます（サーバーには送信されません）。共用PCでは印刷後に「クリア」してください。<br>
    <span class="new-legend">NEW</span> は新規に制定した帳票です。
  </div>
  <div class="kinds" id="kinds"></div>
  <div class="cats" id="cats"></div>
  <input class="search" type="search" placeholder="帳票名・番号で絞り込み" id="q">
  <div class="list" id="list"></div>
</div>
<script src="forms/catalog.js"></script>
<script>
  (function () {
    var list = document.getElementById('list');
    var catsEl = document.getElementById('cats');
    var KEY = 'shoshiki:_cat'; // 選んだ職種を覚えておく（このブラウザだけ）
    var cur = '';
    try { cur = localStorage.getItem(KEY) || ''; } catch (e) {}
    if (cur && CATS.indexOf(cur) < 0) cur = '';
    // 書式の種類（一般書式／品質記録様式）。これも覚えておく。初期値は一般書式
    var kindsEl = document.getElementById('kinds');
    var KKEY = 'shoshiki:_kind';
    var kind = '一般';
    try { kind = localStorage.getItem(KKEY) || '一般'; } catch (e) {}
    if (!KINDS.some(function (k) { return k[0] === kind; })) kind = '一般';
    var SUB = { '一般': '社内書式アプリ　一般社内書類', '品質': '社内書式アプリ　品質記録様式' };
    function renderKinds() {
      kindsEl.innerHTML = '';
      KINDS.forEach(function (k) {
        var b = document.createElement('button');
        b.type = 'button';
        b.textContent = k[1];
        if (k[0] === kind) b.className = 'on';
        b.onclick = function () {
          kind = k[0];
          try { localStorage.setItem(KKEY, kind); } catch (e) {}
          renderKinds(); render();
        };
        kindsEl.appendChild(b);
      });
      document.getElementById('sub').textContent = SUB[kind];
    }
    var q = '';
    function inCat(c) { return !cur || c.cat === '共通' || (Array.isArray(c.cat) && c.cat.indexOf(cur) >= 0); }
    function renderCats() {
      catsEl.innerHTML = '';
      [''].concat(CATS).forEach(function (name) {
        var b = document.createElement('button');
        b.type = 'button';
        b.textContent = name || 'すべて';
        if (name === cur) b.className = 'on';
        b.onclick = function () {
          cur = name;
          try { localStorage.setItem(KEY, cur); } catch (e) {}
          renderCats(); render();
        };
        catsEl.appendChild(b);
      });
    }
    function render() {
      list.innerHTML = '';
      CATALOG.forEach(function (c) {
        if ((c.kind || '一般') !== kind) return;
        if (!inCat(c)) return;
        if (q && (c.no + c.title).indexOf(q) < 0) return;
        var el = document.createElement('a');
        el.className = 'card' + (c.kind === '品質' ? ' q' : '');
        el.href = 'form.html?id=' + c.id;
        el.innerHTML = '<span class="no"></span><span class="t"></span>';
        el.querySelector('.no').textContent = c.no;
        el.querySelector('.t').textContent = c.title;
        if (cur && c.cat === '共通') { var cm = document.createElement('span'); cm.className = 'common'; cm.textContent = '共通'; el.querySelector('.t').after(cm); }
        if (c.isNew) { var nw = document.createElement('span'); nw.className = 'new'; nw.textContent = 'NEW'; el.appendChild(nw); }
        list.appendChild(el);
      });
      if (!list.children.length) {
        var em = document.createElement('div');
        em.className = 'empty';
        em.textContent = '該当する帳票はまだありません。';
        list.appendChild(em);
      }
      fitNames();
    }
    // 帳票名がカードに入りきらない時は、1行に収まるまで文字を小さくする（下限 8pt）
    function fitNames() {
      list.querySelectorAll('.card .t').forEach(function (t) {
        t.style.fontSize = '';
        var pt = 10.5;
        while (t.scrollWidth > t.clientWidth && pt > 8) { pt -= 0.25; t.style.fontSize = pt + 'pt'; }
      });
    }
    var rt;
    window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(fitNames, 100); });
    if (document.fonts) document.fonts.ready.then(fitNames);
    document.getElementById('q').addEventListener('input', function (e) { q = e.target.value.trim(); render(); });
    renderKinds(); renderCats(); render();
  })();
</script>
</body>
</html>
