<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Y-Format（社内書式アプリ）</title>
<link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Y-Format">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1f3f8f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&display=swap">
<link rel="stylesheet" href="assets/app.css?v=2026111105"> <!-- 版番号は form.html と同じ -->
<style>
  .wrap { max-width: 980px; margin: 0 auto; padding: 16px; }
  .intro { background: #fff; border-radius: 6px; padding: 12px 16px; font-size: 10pt; line-height: 1.7; margin-bottom: 14px; }
  .search { width: 100%; font: inherit; font-size: 11pt; padding: 8px 12px; border: 1px solid #b8bfcc; border-radius: 6px; margin-bottom: 12px; }
  .list { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 8px; }
  .card {
    display: flex; align-items: center; gap: 10px;
    background: #fff; border-radius: 6px; padding: 10px 12px;
    text-decoration: none; color: inherit; border: 1px solid transparent;
  }
  a.card:hover { border-color: var(--accent); box-shadow: 0 1px 4px rgba(31,63,143,.25); }
  .card .no { font-size: 9pt; color: #fff; background: var(--accent); border-radius: 3px; padding: 2px 6px; white-space: nowrap; }
  /* 帳票名は1行で表示。入りきらない時だけ文字を小さくする（fitNames） */
  /* アプリ名 Y-Format（2026-10-21 決定）：ご案内と同じ Montserrat ExtraBold、Format は黄色 */
  .tb-title .app-sub { font-size: 10pt; margin-left: 10px; opacity: .9; font-weight: bold; }
  @media (max-width: 560px) { .tb-title .app-sub { display: none; } } /* スマホでは名前だけにしてボタンを1行に */
  .card .t { font-size: 10.5pt; line-height: 19px; white-space: nowrap; overflow: hidden; min-width: 0; }
  .card.wip { opacity: .55; }
  .card.wip .no { background: #888; }
  .card .badge { margin-left: auto; font-size: 8pt; color: #666; white-space: nowrap; }
  /* NEW マークの説明（カードの NEW と同じ見た目） */
  .intro .new-legend { display: inline-block; font-size: 8pt; font-weight: 800; color: #fff; background: #e8452c; border-radius: 99px; padding: 1px 8px; letter-spacing: .05em; vertical-align: 1px; margin-right: 2px; }
  .cats-hint { font-size: 9.5pt; color: #4a5a7a; margin: -2px 2px 6px; } /* 職種ボタンの説明（2026-11-09 ユーザー指定） */
  .cats { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .cats button { font: inherit; font-size: 10pt; padding: 5px 14px; border-radius: 99px; border: 1px solid #b8bfcc; background: #fff; color: #333; cursor: pointer; }
  .cats button:hover { border-color: var(--accent); }
  .cats button.on { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
  /* 書式の種類（一般書式／品質記録様式）：職種ボタンの上のタブ */
  .kinds { display: flex; gap: 0; margin-bottom: 10px; border-bottom: 2px solid var(--accent); }
  .kinds button { font: inherit; font-size: 11pt; font-weight: 700; padding: 7px 20px; border: 1px solid #b8bfcc; border-bottom: 0; border-radius: 6px 6px 0 0; background: #e9edf4; color: #555; cursor: pointer; margin-right: 4px; }
  .kinds button:hover { color: var(--accent); }
  .kinds button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .card.q .no { background: #2e7d5b; } /* 品質記録様式の番号は緑 */
  .list .empty { grid-column: 1 / -1; color: #666; font-size: 10pt; padding: 12px 4px; }
  .card .common { font-size: 8pt; color: #4a5a7a; background: #e6ecf7; border-radius: 3px; padding: 1px 5px; white-space: nowrap; }
  .card .new { margin-left: auto; font-size: 8pt; font-weight: 800; color: #fff; background: #e8452c; border-radius: 99px; padding: 2px 8px; letter-spacing: .05em; white-space: nowrap; }
  /* β版：カード全体の色と枠、右端のマークで目立たせる（ユーザー指定） */
  .card.beta { background: #f6effc; border-color: #7b3fb5; }
  .card .beta-mark, .intro .beta-legend { font-weight: 800; color: #fff; background: #7b3fb5; border-radius: 99px; letter-spacing: .05em; white-space: nowrap; }
  .card .beta-mark { margin-left: auto; flex: none; font-size: 9pt; padding: 2px 9px; }
  .intro .beta-legend { display: inline-block; font-size: 8pt; padding: 1px 8px; vertical-align: 1px; margin-right: 2px; }
  /* 伝票タブ：別アプリへのリンク。カード全体でアプリを開き、右の「使い方」は別リンク（2026-11-11） */
  .card.slip { position: relative; }
  .card.slip:hover { border-color: var(--accent); box-shadow: 0 1px 4px rgba(31,63,143,.25); }
  .card.slip a.t { color: inherit; text-decoration: none; }
  .card.slip a.t::after { content: ''; position: absolute; inset: 0; } /* カード全体をクリックできるように */
  .card.slip .guide { position: relative; z-index: 1; margin-left: auto; flex: none; font-size: 9pt; color: var(--accent); background: #e6ecf7; border-radius: 99px; padding: 2px 10px; text-decoration: none; white-space: nowrap; }
  .card.slip .guide:hover { background: var(--accent); color: #fff; }
  /* 折りたたみ欄（catalog.js の group。例：定期券起票者専用）。一覧の下に区切って置き、初めは閉じておく（2026-11-11） */
  .grp { grid-column: 1 / -1; margin-top: 10px; border-top: 1px dashed #b8bfcc; padding-top: 10px; }
  .grp-head { font: inherit; font-size: 10pt; font-weight: 700; color: #4a5a7a; background: #eef1f6; border: 1px solid #c9d0dc; border-radius: 6px; padding: 6px 14px; cursor: pointer; }
  .grp-head:hover { border-color: var(--accent); color: var(--accent); }
  .grp-head .arw { display: inline-block; width: 1em; margin-right: 6px; font-size: 9pt; transition: transform .15s; }
  .grp.open .grp-head .arw { transform: rotate(90deg); }
  .grp-head .ct { font-weight: 400; margin-left: 2px; }
  .grp-body { display: none; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 8px; margin-top: 8px; }
  .grp.open .grp-body { display: grid; }
</style>
</head>
<body>
<div class="toolbar"><div class="tb-title"><span class="app-name"><span class="y">Y</span>-Format</span><span class="app-sub" id="sub">社内書式アプリ　一般社内書類</span></div><button onclick="location.href='list.html'">配布用一覧</button></div>
<div class="wrap">
  <div class="intro">
    帳票を選んで入力し、「印刷」ボタンで紙に出力して回送してください。<br>
    入力内容はこのパソコンのブラウザ内にだけ一時保存されます（サーバーには送信されません）。共用PCでは印刷後に「クリア」してください。<br>
    <span class="new-legend">NEW</span> は新規に制定した帳票です。　<span class="beta-legend">β版</span> は試行中の帳票です。
  </div>
  <div class="kinds" id="kinds"></div>
  <div class="cats-hint">所属の部署を選ぶと帳票が絞られます。</div>
  <div class="cats" id="cats"></div>
  <input class="search" type="search" placeholder="帳票名・番号で絞り込み" id="q">
  <div class="list" id="list"></div>
</div>
<script src="forms/catalog.js?v=2026111105"></script>
<script>
  (function () {
    var list = document.getElementById('list');
    var catsEl = document.getElementById('cats');
    var KEY = 'shoshiki:_cat'; // 選んだ職種を覚えておく（このブラウザだけ）
    var cur = '';
    try { cur = localStorage.getItem(KEY) || ''; } catch (e) {}
    // 書式の種類（一般書式／品質記録様式）。これも覚えておく。初期値は一般書式
    var kindsEl = document.getElementById('kinds');
    var KKEY = 'shoshiki:_kind';
    var kind = '一般';
    try { kind = localStorage.getItem(KKEY) || '一般'; } catch (e) {}
    // ?kind=伝票 のようにURLで種類を指定して開ける（伝票アプリの配布用PDFのQR・ボタンから伝票タブを直接開く。2026-11-11）
    var qkind = null;
    try { qkind = new URLSearchParams(location.search).get('kind'); } catch (e) {}
    if (qkind && KINDS.some(function (k) { return k[0] === qkind; })) {
      kind = qkind;
      try { localStorage.setItem(KKEY, kind); } catch (e) {}
    }
    if (!KINDS.some(function (k) { return k[0] === kind; })) kind = '一般';
    var SUB = { '一般': '社内書式アプリ　一般社内書類', '品質': '社内書式アプリ　品質記録様式', '伝票': '社内書式アプリ　伝票' };
    var NO_CATS = { '伝票': true }; // 職種の絞り込みをしない種類（伝票は別アプリへのリンク）
    var hintEl = document.querySelector('.cats-hint');
    var HINT = hintEl.textContent;
    function renderKinds() {
      kindsEl.innerHTML = '';
      KINDS.forEach(function (k) {
        var b = document.createElement('button');
        b.type = 'button';
        b.textContent = k[1];
        if (k[0] === kind) b.className = 'on';
        b.onclick = function () {
          kind = k[0];
          try { localStorage.setItem(KKEY, kind); } catch (e) {}
          renderKinds(); renderCats(); render();
        };
        kindsEl.appendChild(b);
      });
      document.getElementById('sub').textContent = SUB[kind];
    }
    var q = '';
    function inCat(c) { return !cur || c.cat === '共通' || (Array.isArray(c.cat) && c.cat.indexOf(cur) >= 0); }
    // 選んでいる種類の職種ボタン（共通の職種＋種類ごとの追加分）
    function catsOf() { return CATS.concat((window.KIND_CATS || {})[kind] || []); }
    function renderCats() {
      catsEl.innerHTML = '';
      catsEl.style.display = NO_CATS[kind] ? 'none' : '';
      hintEl.textContent = NO_CATS[kind] ? '伝票は別のアプリが新しいタブで開きます。「使い方」から操作の説明を見られます。' : HINT;
      if (NO_CATS[kind]) return; // 選んでいた職種（cur）は覚えたまま。ほかのタブに戻ると元どおり
      if (cur && catsOf().indexOf(cur) < 0) cur = ''; // ほかの種類にしかない職種を選んでいたら「すべて」に戻す
      [''].concat(catsOf()).forEach(function (name) {
        var b = document.createElement('button');
        b.type = 'button';
        b.textContent = name || 'すべて';
        if (name === cur) b.className = 'on';
        b.onclick = function () {
          cur = name;
          try { localStorage.setItem(KEY, cur); } catch (e) {}
          renderCats(); render();
        };
        catsEl.appendChild(b);
      });
    }
    // 折りたたみ欄（catalog.js の group）。開け閉めはこのブラウザで覚える。初めは閉じている
    var GKEY = 'shoshiki:_grp:';
    function grpOpen(name) { try { return localStorage.getItem(GKEY + name) === '1'; } catch (e) { return false; } }
    function groupBox(name, cards) {
      var box = document.createElement('div');
      box.className = 'grp';
      var head = document.createElement('button');
      head.type = 'button';
      head.className = 'grp-head';
      var body = document.createElement('div');
      body.className = 'grp-body';
      cards.forEach(function (el) { body.appendChild(el); });
      var forced = !!q; // 絞り込み中は、当てはまった帳票が見えるように開いておく
      function show(open) {
        box.classList.toggle('open', open);
        head.innerHTML = '<span class="arw"></span><span class="nm"></span><span class="ct"></span>';
        head.querySelector('.arw').textContent = '▶'; // 開いたら CSS で下向きに回す
        head.querySelector('.nm').textContent = name;
        head.querySelector('.ct').textContent = '（' + cards.length + '件）';
        head.setAttribute('aria-expanded', open ? 'true' : 'false');
      }
      show(forced || grpOpen(name));
      head.onclick = function () {
        var open = !box.classList.contains('open');
        try { localStorage.setItem(GKEY + name, open ? '1' : '0'); } catch (e) {}
        show(open);
        if (open) fitNames();
      };
      box.appendChild(head);
      box.appendChild(body);
      return box;
    }
    function render() {
      list.innerHTML = '';
      var groups = {}, gorder = [];
      CATALOG.forEach(function (c) {
        if ((c.kind || '一般') !== kind) return;
        if (c.hidden) return; // 一覧から外した帳票（定義は残す。catalog.js の hidden）
        if (!NO_CATS[kind] && !inCat(c)) return;
        if (q && (c.no + c.title + (c.old || '')).indexOf(q) < 0) return; // old：旧番号（般-14 など）でも見つかる
        var el = c.url ? slipCard(c) : formCard(c); // 伝票：別アプリへのリンク
        if (c.group) { // 担当者だけが使うもの：一覧の下の折りたたみ欄にまとめる
          if (!groups[c.group]) { groups[c.group] = []; gorder.push(c.group); }
          groups[c.group].push(el);
          return;
        }
        list.appendChild(el);
      });
      gorder.forEach(function (g) { list.appendChild(groupBox(g, groups[g])); });
      if (!list.children.length) {
        var em = document.createElement('div');
        em.className = 'empty';
        em.textContent = '該当する帳票はまだありません。';
        list.appendChild(em);
      }
      fitNames();
    }
    function formCard(c) {
        var el = document.createElement('a');
        el.className = 'card' + (c.kind === '品質' ? ' q' : '') + (c.isBeta ? ' beta' : '');
        el.href = 'form.html?id=' + c.id;
        el.innerHTML = '<span class="no"></span><span class="t"></span>';
        el.querySelector('.no').textContent = c.no;
        el.querySelector('.t').textContent = c.title;
        if (cur && c.cat === '共通') { var cm = document.createElement('span'); cm.className = 'common'; cm.textContent = '共通'; el.querySelector('.t').after(cm); }
        if (c.isNew) { var nw = document.createElement('span'); nw.className = 'new'; nw.textContent = 'NEW'; el.appendChild(nw); }
        if (c.isBeta) { var bt = document.createElement('span'); bt.className = 'beta-mark'; bt.textContent = 'β版'; el.appendChild(bt); }
        return el;
    }
    // 伝票アプリのカード（catalog.js の url・guide・color）。アプリも使い方も新しいタブで開く
    function slipCard(c) {
      var el = document.createElement('div');
      el.className = 'card slip';
      el.innerHTML = '<span class="no"></span><a class="t" target="_blank" rel="noopener"></a>';
      var no = el.querySelector('.no');
      no.textContent = c.no;
      if (c.color) no.style.background = c.color;
      var t = el.querySelector('.t');
      t.textContent = c.title;
      t.href = c.url;
      if (c.guide) {
        var g = document.createElement('a');
        g.className = 'guide'; g.target = '_blank'; g.rel = 'noopener';
        g.href = c.guide; g.textContent = '📖 使い方';
        el.appendChild(g);
      }
      return el;
    }
    // 帳票名がカードに入りきらない時は、1行に収まるまで文字を小さくする（下限 8pt）
    function fitNames() {
      list.querySelectorAll('.card .t').forEach(function (t) {
        t.style.fontSize = '';
        var pt = 10.5;
        while (t.scrollWidth > t.clientWidth && pt > 8) { pt -= 0.25; t.style.fontSize = pt + 'pt'; }
      });
    }
    var rt;
    window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(fitNames, 100); });
    if (document.fonts) document.fonts.ready.then(fitNames);
    document.getElementById('q').addEventListener('input', function (e) { q = e.target.value.trim(); render(); });
    renderKinds(); renderCats(); render();
  })();
</script>
</body>
</html>
